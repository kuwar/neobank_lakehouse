[pytest]
# Only look for tests here — keeps collection fast and predictable.
testpaths = tests

# Make src/ importable so `from transforms import ...` works without packaging.
pythonpath = src

# Discovery patterns (these are the defaults, shown explicitly for clarity).
python_files = test_*.py
python_functions = test_*

# Flags applied to every run, as if typed on the command line.
#   -v          list each test by name
#   --tb=short  compact, readable tracebacks
#   --strict-markers  error on an unregistered/typo'd marker instead of warning
addopts = -v --tb=short --strict-markers

# Register custom markers. Run only fast tests with:  pytest -m "not integration"
markers =
    integration: tests that read real files or need a cluster (deselect with -m "not integration")
    slow: slow-running tests