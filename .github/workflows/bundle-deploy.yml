# Dev is deployed locally; CI only validates it. Prod is deployed by CI as sp-github-cicd.
#
# GitHub environments (dev, prod):
#   secrets:   DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
#   variables: DATABRICKS_BUNDLE_TARGET
# Client ID/secret: terraform outputs sp_cicd_client_id / sp_cicd_client_secret.
#
# deploy-prod is disabled until the neobank_prod catalog exists (repo variable PROD_DEPLOY_ENABLED).
name: bundle-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_BUNDLE_TARGET: ${{ vars.DATABRICKS_BUNDLE_TARGET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate

  deploy-prod:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    needs: validate-dev
    runs-on: ubuntu-latest
    environment: prod
    # One prod deploy at a time
    concurrency:
      group: bundle-prod
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_BUNDLE_TARGET: ${{ vars.DATABRICKS_BUNDLE_TARGET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6 # wheel build
      - uses: databricks/setup-cli@main
      - run: make dashboards TARGET_ENV=prod # neobank_prod names in the dashboard
      - run: databricks bundle validate
      - run: databricks bundle deploy
