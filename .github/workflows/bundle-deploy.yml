# Dev is deployed locally; CI only validates it. Prod is deployed by CI as sp-github-cicd.
# GitHub setup is Terraform-managed (terraform/shared/github.tf): docs/MULTI_ENVIRONMENT_DEPLOYMENTS.md §7

name: bundle-deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-dev:
    runs-on: ubuntu-latest
    environment: dev
    # Host comes from databricks.yaml; secrets are set by terraform/shared/github.tf
    env:
      TARGET_ENV: dev # read by the Makefile, as .env does locally
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: make validate

  deploy-prod:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    needs: validate-dev
    runs-on: ubuntu-latest
    environment: prod
    # One prod deploy at a time
    concurrency:
      group: bundle-prod
      cancel-in-progress: false
    # Host comes from databricks.yaml; secrets are set by terraform/shared/github.tf
    env:
      TARGET_ENV: prod
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6 # wheel build
      - uses: databricks/setup-cli@main
      - run: make validate # renders the prod dashboard first
      - run: make deploy
