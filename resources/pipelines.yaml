# Single pipeline for bronze, silver and gold.
resources:
  pipelines:
    neobank_medallion:
      name: neobank_medallion
      serverless: true                 # required on Free Edition
      catalog: ${var.catalog}
      schema: ${var.gold_schema}       # default; each layer sets its own
      continuous: false                # triggered

      # Serverless takes the wheel via environment, not libraries.
      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        neobank.catalog: ${var.catalog}
        neobank.bronze_schema: ${var.bronze_schema}
        neobank.silver_schema: ${var.silver_schema}
        neobank.gold_schema: ${var.gold_schema}
        neobank.volume: ${var.volume}

      event_log:
        catalog: ${var.catalog}
        schema: ${var.silver_schema}
        name: neobank_pipeline_event_logs_${bundle.target}

      libraries:
        - notebook:
            path: ../src/pipelines/bronze.py
        - notebook:
            path: ../src/pipelines/silver.py
        - notebook:
            path: ../src/pipelines/gold.py