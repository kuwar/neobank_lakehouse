# Lakeflow Declarative Pipeline (formerly Delta Live Tables) that builds the
# full bronze → silver → gold medallion in one governed, incremental pipeline.
resources:
  pipelines:
    neobank_medallion:
      name: neobank_medallion
      serverless: true                 # required on Free Edition
      catalog: ${var.catalog}          # Unity Catalog target
      schema: ${var.gold_schema}       # default publish schema; layers set their own
      continuous: false                # triggered runs (cheaper); set true for streaming

      # Serverless installs custom code via the environment, NOT via libraries: - whl:
      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        neobank.catalog: ${var.catalog}
        neobank.bronze_schema: ${var.bronze_schema}
        neobank.silver_schema: ${var.silver_schema}
        neobank.gold_schema: ${var.gold_schema}
        neobank.volume: ${var.volume}

      event_log:
        catalog: ${var.catalog}
        schema: ${var.silver_schema}
        name: neobank_pipeline_event_logs_${bundle.target}

      libraries:
        - notebook:
            path: ../src/pipelines/bronze.py
        - notebook:
            path: ../src/pipelines/silver.py
        - notebook:
            path: ../src/pipelines/gold.py