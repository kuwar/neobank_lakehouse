# Orchestration job: land data -> run the medallion pipeline -> (re)build metric views.
# Scheduled daily; in dev mode the schedule is auto-paused so it never fires by surprise.
resources:
  jobs:
    neobank_daily:
      name: neobank_daily
      email_notifications:
        on_failure:
          - "${var.oncall_email}"
      webhook_notifications:
        on_failure:
          - id: "${var.slack_destination_id}"
        on_success:
          - id: "${var.slack_destination_id}"
      notification_settings:
        no_alert_for_skipped_runs: true
      tags:
        project: neobank
        layer: orchestration
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # 05:00 daily (paused in dev)
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: sample_rows
          default: ${var.sample_rows}

      tasks:
        # 1) Download Kaggle data into the volume + generate synthetic events.
        - task_key: land_data
          environment_key: default
          spark_python_task:
            python_file: ../src/ingest/land_and_generate_data.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--volume"
              - "${var.volume}"
              - "--sample-rows"
              - "${var.sample_rows}"

        # 2) Run the medallion pipeline (bronze -> silver -> gold).
        - task_key: build_medallion
          depends_on:
            - task_key: land_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.neobank_medallion.id}

        # 3) Create/refresh the Unity Catalog metric views (semantic layer).
        - task_key: build_metric_views
          depends_on:
            - task_key: build_medallion
          environment_key: default
          spark_python_task:
            python_file: ../src/metrics/create_metric_views.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--gold-schema"
              - "${var.gold_schema}"
        
        # 4) Create/Refresh UC object (function) - column level functions
        - task_key: udf_column_level_security
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: "${var.catalog}"
              gold_schema: "${var.gold_schema}"
            file:
              path: ../src/udf/uc_columns_functions.sql

        # 5) Create/Refresh UC object (function) - rows level functions
        - task_key: udf_rows_level_security
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: "${var.catalog}"
              gold_schema: "${var.gold_schema}"
            file:
              path: ../src/udf/uc_rows_functions.sql

      # Serverless wheel install — this DOES work for spark_python_task
      environments:
        - environment_key: default
          spec:
            environment_version: "3"          # serverless env version; bump if validate complains
            dependencies:
              - ../dist/*.whl