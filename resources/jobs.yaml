# Daily run: land data, run the pipeline, tag gold columns, rebuild metric views.
# Schedule is paused in dev mode.
resources:
  jobs:
    neobank_daily:
      name: neobank_daily
      email_notifications:
        on_failure:
          - "${var.oncall_email}"
      webhook_notifications:
        on_failure:
          - id: "${var.slack_destination_id}"
        on_success:
          - id: "${var.slack_destination_id}"
      notification_settings:
        no_alert_for_skipped_runs: true
      tags:
        project: neobank
        layer: orchestration
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # 05:00 UTC
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: sample_rows
          default: ${var.sample_rows}

      tasks:
        # Kaggle download + synthetic device/notification events into the volume
        - task_key: land_data
          environment_key: default
          spark_python_task:
            python_file: ../src/ingest/land_and_generate_data.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--volume"
              - "${var.volume}"
              - "--sample-rows"
              - "${var.sample_rows}"

        - task_key: build_medallion
          depends_on:
            - task_key: land_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.neobank_medallion.id}

        # Governed tags on sensitive gold columns; the ABAC policies key off them.
        - task_key: tag_gold_columns
          depends_on:
            - task_key: build_medallion
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: "${var.catalog}"
              gold_schema: "${var.gold_schema}"
            file:
              path: ../src/governance/tag_gold_columns.sql

        - task_key: build_metrics_views
          depends_on:
            - task_key: build_medallion
          environment_key: default
          spark_python_task:
            python_file: ../src/metrics/create_metric_views.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--gold-schema"
              - "${var.gold_schema}"
              - "--metrics-view-schema"
              - "${var.metrics_view_schema}"

      # Wheel for the spark_python_task steps
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl

    # Mask and row-filter UDFs used by the ABAC policies. Separate job so it can
    # run before the policies are applied (see README, deploy order).
    neobank_security_functions:
      name: neobank_security_functions
      tags:
        project: neobank
        layer: governance
      tasks:
        - task_key: udf_column_level_security
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: "${var.catalog}"
              gold_schema: "${var.gold_schema}"
            file:
              path: ../src/udf/uc_columns_functions.sql

        - task_key: udf_rows_level_security
          sql_task:
            warehouse_id: ${var.warehouse_id}
            parameters:
              catalog: "${var.catalog}"
              gold_schema: "${var.gold_schema}"
            file:
              path: ../src/udf/uc_rows_functions.sql
