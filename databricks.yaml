# Neobank lakehouse: medallion pipeline (bronze/silver/gold) plus metric views on gold.
bundle:
  name: neobank_lakehouse

artifacts:
  neobank_wheel:
    type: whl
    build: uv build --wheel
    path: .
    dynamic_version: true
    
include:
  - resources/*.yaml

sync:
  exclude:
    - src/dashboards/*.lvdash.json

# Override per target or with --var name=value.
variables: 
  warehouse_id:
    description: Warehouse must exist before
    default: dfc7731614511a53
  catalog:
    # Set from .envrc (BUNDLE_VAR_catalog). Must match terraform/modules/neobank_env (neobank_<env>).
    # Target values below are the fallback, e.g. in CI.
    description: Unity Catalog catalog for all objects
    default: neobank_dev
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  metrics_view_schema:
    default: metrics_view
  volume:
    description: Volume that holds landed raw files
    default: raw
  # Kept small for the Free Edition quota.
  sample_rows:
    description: Max transactions to load (0 = all ~13M)
    default: "500000"
  # Destinations are managed in Terraform (terraform/shared/notifications.tf); looked up by name.
  slack_destination_id:
    description: Neobank slack notification - managed using terraform
    lookup:
      notification_destination: slack_neobank
  email_destination_id:
    description: Neobank email notification - managed using terraform
    lookup:
      notification_destination: neobank_email_notification
  cicd_sp_application_id:
    description: Application ID of the GitHub CI/CD SP (set per target via lookup)
    default: ""
  oncall_email:
    description: Urgent job failed notify to
    default: 'kuwarsaurav21@gmail.com'

targets:
  # Personal sandbox: [dev <user>] prefix, schedules paused.
  dev:
    mode: development
    default: true
    variables:
      catalog: neobank_dev
    workspace:
      host: https://dbc-31fcc0ce-44e6.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-31fcc0ce-44e6.cloud.databricks.com
      # SP home: one copy regardless of who deploys. /Workspace/Shared is writable by all users.
      root_path: /Workspace/Users/${var.cicd_sp_application_id}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: neobank_prod
      # CI/CD SP (terraform/shared/service_principals.tf), resolved to its application ID.
      cicd_sp_application_id:
        lookup:
          service_principal: sp-github-cicd
    resources:
      dashboards:
        neobank_analytics:
          # Rendered with neobank_prod names: make dashboards TARGET_ENV=prod
          file_path: build/dashboards/neobank_analytics.prod.lvdash.json
    # Prod jobs and pipelines run as the SP.
    run_as:
      service_principal_name: ${var.cicd_sp_application_id}
    permissions:
      - user_name: kuwarsaurav21@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ${var.cicd_sp_application_id}
        level: CAN_MANAGE
