# This is a Declarative Automation Bundle definition for dab_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_demo
  uuid: d68539b5-9356-4574-9e3c-c97a28958dc6

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-31fcc0ce-44e6.cloud.databricks.com
    variables:
      catalog: freeedition
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-31fcc0ce-44e6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kuwarsaurav21@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kuwarsaurav21@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: freeedition
      schema: prod
    permissions:
      - user_name: kuwarsaurav21@gmail.com
        level: CAN_MANAGE
